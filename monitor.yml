name: Freiburg Halbmarathon Monitor

on:
  push:
    branches: [main]
    paths: [freiburg_monitor.py, .github/workflows/monitor.yml]
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: freiburg-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Angebote prüfen und Telegram benachrichtigen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 freiburg_monitor.py
      - name: Benachrichtigte Angebote merken
        if: always()
        run: |
          if [ ! -f .monitor/state.json ]; then exit 0; fi
          git add -- .monitor/state.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update monitor state'
          git push origin HEAD:main
